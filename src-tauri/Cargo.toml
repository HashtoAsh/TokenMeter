[package]
name = "token-meter"
version = "0.1.0"
edition = "2021"

[features]
# production builds embed the frontend via tauri's custom protocol
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [
  "system-tray",
  # 与 tauri.conf.json 的 window allowlist 一一对应（tauri-build 会校验两者一致）
  "window-create",
  "window-show",
  "window-hide",
  "window-close",
  "window-set-focus",
  "window-unminimize",
  "window-set-size",
  "window-set-position",
  "window-start-dragging",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.10"
single-instance = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"
hostname = "0.3"
winreg = "0.52"
